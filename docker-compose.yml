version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: c3-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Shashini1223@
      POSTGRES_DB: coconutrisk_c3
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: c3-ml-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - C3_DATA_DIR=/app/research-data
      - C3_MODEL_DIR=/app/ml-service/saved_models
      - C3_DEMO_MODE=true
    volumes:
      - ./research-data:/app/research-data:ro
      - ./ml-service/saved_models:/app/ml-service/saved_models

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: c3-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ML_SERVICE_URL=http://ml-service:8001/internal/c3
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=Shashini1223@
      - PGDATABASE=coconutrisk_c3
      - DATABASE_URL=postgresql://postgres:Shashini1223@postgres:5432/coconutrisk_c3
      - NODE_ENV=production
      - JWT_SECRET=docker_c3_jwt_secret_key_2026
    depends_on:
      - postgres
      - ml-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: c3-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
